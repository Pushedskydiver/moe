name: CI

# The "Quality suite" job mirrors AGENTS.md's documented pre-push suite exactly
# (same commands, same order) so a green run here reproduces locally with no
# hidden extra steps. "Agent frontmatter" is a separate, additional gate
# (docs/DEVELOPMENT.md §Quality Gates): it now also covers AGENTS.md,
# CLAUDE.md and .claude/rules/ (via `pnpm check:rulebook`), and it only
# matters after editing those, .claude/agents/, scripts/, tsconfig.base.json
# or a root dependency — not on every push.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality suite
    runs-on: ubuntu-latest
    # packages/core's ticket-lifecycle tests need a real Postgres (docs/TESTING.md: prefer a
    # real test database) — a vanilla postgres:17 service is a faithful stand-in for Neon
    # (which runs unmodified Postgres under the hood), no external API/secret needed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: moe_ci_password
          POSTGRES_DB: moe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:moe_ci_password@localhost:5432/moe_ci
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm knip

  agent-frontmatter:
    name: Agent frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # The root package isn't in `pnpm -r`, so the quality suite's typecheck and test never
      # reach root scripts/ — this job is the only place they're type-checked and tested.
      - run: pnpm typecheck:scripts
      - run: pnpm test:scripts
      - run: pnpm check:agents
      - run: pnpm check:rulebook

  fly-configs-freshness:
    name: Fly configs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      # No `pnpm format` step: Prettier has no TOML parser, so it leaves fly.*.toml untouched and
      # the generator's own output is already the canonical form.
      - run: pnpm --filter @moe/core generate:fly-configs
      # Staged first, then diffed against HEAD, rather than a bare `git diff --exit-code`: adding a
      # ninth persona to the roster emits a brand-new fly.<id>.toml, and an *untracked* file is
      # invisible to a plain `git diff`. `git add -A` picks up added, modified and deleted alike —
      # the deleted case is reachable because the generator sweeps orphaned configs before writing.
      - run: git add -A -- 'fly.*.toml'
      - run: git diff --cached --exit-code -- 'fly.*.toml'
